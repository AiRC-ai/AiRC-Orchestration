name: Bug report
description: Report a reproducible AiRC Orchestration problem
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I checked the Releases page and reproduced this on the latest available build.
          required: true
        - label: I removed credentials, private URLs, personal data, and customer data.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: input
    attributes:
      label: AiRC build or source revision
      placeholder: Build identifier, release tag, or commit SHA
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Operating system
      options:
        - macOS Apple silicon
        - Debian-family Linux amd64
        - Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Include provider type, model name, screenshots, or sanitized logs when relevant.
