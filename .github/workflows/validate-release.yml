name: Validate release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft or published release tag to validate
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download release assets
        run: scripts/download-release-assets.sh "$RELEASE_TAG" release
      - name: Validate release structure and available installers
        run: scripts/validate-release.sh release

  validate-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            nativeArchitecture: arm64
          - runner: macos-15-intel
            architecture: x64
            nativeArchitecture: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download release assets
        run: scripts/download-release-assets.sh "$RELEASE_TAG" release
      - name: Validate release structure and available macOS installer
        run: |
          scripts/validate-release.sh release
          architecture='${{ matrix.architecture }}'
          test "$(uname -m)" = '${{ matrix.nativeArchitecture }}'
          macos_archive=$(find release -maxdepth 1 -type f -name "AiRC-*-macOS-${architecture}.zip" -print -quit)
          if [[ -z $macos_archive ]]; then
            echo "No macOS ${architecture} artifact is included."
            exit 0
          fi
          scripts/verify-macos-release.sh "$macos_archive" "$architecture"
          runtime_directory=$(mktemp -d)
          trap 'rm -rf "$runtime_directory"' EXIT
          ditto -x -k "$macos_archive" "$runtime_directory"
          python3 - "$runtime_directory/AiRC.app/Contents/Resources/bin/airc" release/release-manifest.json <<'PYMAC'
          import json
          import subprocess
          import sys
          version = json.load(open(sys.argv[2]))['version']
          result = subprocess.run([sys.argv[1], '--version'], capture_output=True, text=True, check=True, timeout=20)
          if not result.stdout.strip().endswith(' ' + version):
              raise SystemExit('Native backend version does not match the release manifest')
          print('Native macOS backend launched with the expected release version')
          PYMAC

  validate-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir release --clobber
      - name: Verify Windows installer integrity and signing state
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw release/release-manifest.json | ConvertFrom-Json
          $artifact = @($manifest.artifacts | Where-Object { $_.kind -eq 'windows-installer' })
          if ($artifact.Count -eq 0) {
            Write-Host 'No Windows installer is included in this release.'
            exit 0
          }
          if ($artifact.Count -ne 1) {
            throw 'The release must contain exactly one Windows installer manifest entry.'
          }
          $installer = Join-Path release $artifact[0].fileName
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Missing Windows installer: $installer"
          }
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($actualHash -ne $artifact[0].sha256) {
            throw "Windows installer hash mismatch: $actualHash"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          $signatureIsValid = $signature.Status -eq 'Valid'
          if ([bool]$artifact[0].codeSigned -ne $signatureIsValid) {
            throw "Windows signing metadata does not match Authenticode status: $($signature.Status)"
          }
          Write-Host "Windows installer verified; Authenticode status: $($signature.Status)"
